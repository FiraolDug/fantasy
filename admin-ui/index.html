<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPL Weekly — Admin</title>
<style>
:root{
  --bg:#f2f7f2;--card:#fff;--text:#1b2e1f;--muted:#5f6f63;
  --green:#17a673;--green2:#0e7a54;--green-light:#e2f0e9;
  --line:#d8e4dc;--red:#c0473f;--amber:#b8860b;--shadow:0 6px 22px rgba(23,50,30,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}

/* ---------- LOGIN ---------- */
.login-wrap{
  min-height:100vh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(135deg,#0e7a54,#17a673);
}
.login{
  width:100%;max-width:420px;background:#fff;border-radius:18px;
  padding:34px 30px;box-shadow:0 24px 60px rgba(0,0,0,.25);
}
.login-logo{
  width:54px;height:54px;border-radius:14px;background:var(--green);
  color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;
  margin-bottom:18px;
}
.login h1{font-size:20px;margin:0 0 6px}
.login p{font-size:12.5px;color:var(--muted);margin:0 0 22px;line-height:1.5}
.login label{font-size:11px;font-weight:800;display:block;margin-bottom:6px;color:var(--text)}
.login .input-wrap{position:relative;margin-bottom:14px}
.login .input-wrap input{
  width:100%;border:1px solid var(--line);border-radius:11px;padding:13px 42px 13px 13px;
  outline:none;background:#f8faf9;
}
.login .input-wrap input:focus{border-color:var(--green);background:#fff}
.login .input-wrap .toggle-pw{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;
  padding:6px;line-height:1;
}
.login-btn{
  width:100%;background:var(--green);color:#fff;border:0;border-radius:11px;
  padding:13px;font-weight:800;cursor:pointer;font-size:14px;margin-top:6px;
}
.login-btn:active{transform:scale(.99)}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
.login-error{
  background:#fdeaea;color:#a53434;border-radius:10px;padding:10px 12px;
  font-size:12px;margin-bottom:14px;display:none;
}
.login-error.show{display:block}
.demo-creds{
  background:var(--green-light);color:var(--green2);border-radius:10px;
  padding:12px 14px;font-size:11.5px;margin-top:20px;line-height:1.7;
}
.demo-creds b{display:block;margin-bottom:6px;font-size:12px}
.demo-creds code{
  background:rgba(255,255,255,.7);padding:1px 6px;border-radius:4px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
}
.login-foot{
  text-align:center;font-size:11px;color:var(--muted);margin-top:18px;
}
.switch{position:relative;display:inline-block;width:44px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .slider{
  position:absolute;inset:0;background:#d7ded9;border-radius:999px;
  cursor:pointer;transition:background .15s;
}
.switch .slider::before{
  content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:transform .15s;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.switch input:checked + .slider{background:var(--green)}
.switch input:checked + .slider::before{transform:translateX(18px)}
.switch input:disabled + .slider{opacity:.5;cursor:not-allowed}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 0;border-bottom:1px solid var(--border,#e6ede8);
}
.setting-row:last-child{border-bottom:0}
.setting-row .setting-label b{display:block;font-size:14px}
.setting-row .setting-label span{font-size:12px;color:var(--muted)}

/* ---------- LAYOUT ---------- */
.layout{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{
  background:#0e1f18;color:#cfe0d5;padding:18px 14px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.aside-brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px;border-bottom:1px solid #1c3327}
.aside-logo{
  width:36px;height:36px;border-radius:10px;background:var(--green);
  color:#fff;display:grid;place-items:center;font-weight:900;
}
.aside-brand h1{font-size:14px;color:#fff;margin:0}
.aside-brand small{display:block;font-size:10.5px;color:#7b9889;margin-top:2px}
.aside-user{
  padding:14px 8px;border-bottom:1px solid #1c3327;margin-bottom:10px;
}
.aside-user b{display:block;font-size:13px;color:#fff}
.aside-user span{font-size:11px;color:#8aa396}
.aside-user .role{
  display:inline-block;margin-top:6px;background:#1a3429;color:#7de0b8;
  border-radius:6px;padding:2px 8px;font-size:10px;font-weight:800;text-transform:uppercase;
}
aside nav a{
  display:flex;align-items:center;gap:10px;color:#b9cec1;text-decoration:none;
  padding:10px 12px;border-radius:9px;font-size:13px;font-weight:600;
  margin-bottom:2px;cursor:pointer;transition:background .12s;
}
aside nav a.active{background:#1a3429;color:#fff}
aside nav a:hover{background:#16291f}
aside nav a .ico{width:16px;text-align:center;font-size:14px}
aside nav a .count{
  margin-left:auto;background:#e0553f;color:#fff;font-size:10px;font-weight:800;
  border-radius:99px;padding:1px 7px;min-width:18px;text-align:center;
}
aside nav a .count.hidden{display:none}
.aside-foot{
  padding:14px 8px 0;border-top:1px solid #1c3327;margin-top:14px;
  font-size:10.5px;color:#5a7264;
}
.aside-logout{
  margin-top:10px;width:100%;background:#1a3429;color:#b9cec1;border:0;
  border-radius:8px;padding:9px;font-size:11.5px;font-weight:700;cursor:pointer;
}
.aside-logout:hover{background:#22412f;color:#fff}

main{padding:26px 32px 60px;max-width:1300px;width:100%}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap}
.page-head h2{font-size:22px;margin:0 0 4px}
.page-head p{font-size:13px;color:var(--muted);margin:0;max-width:640px}

/* ---------- SEARCH BAR ---------- */
.search-bar{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:14px 18px;margin-bottom:14px;box-shadow:var(--shadow);
}
.search-input-wrap{position:relative;flex:1;min-width:220px}
.search-input-wrap .search-icon{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:13px;pointer-events:none;
}
.search-input{
  width:100%;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px 10px 34px;outline:none;background:#f8faf9;font-size:12.5px;
}
.search-input:focus{border-color:var(--green);background:#fff}
.search-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- CARDS ---------- */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.cards.two{grid-template-columns:repeat(2,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:800}
.card .v{font-size:26px;font-weight:800;margin-top:6px;line-height:1.1}
.card .d{font-size:11px;color:var(--muted);margin-top:6px}
.card.accent{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;border:0}
.card.accent .k{color:rgba(255,255,255,.8)}
.card.accent .d{color:rgba(255,255,255,.8)}

/* ---------- PANELS ---------- */
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:20px;box-shadow:var(--shadow)}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap;
}
.panel-head h3{margin:0;font-size:14px}
.panel-head .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.panel-body{padding:0}

/* ---------- TABLE ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:800;background:#fafcfb}
tr:last-child td{border-bottom:0}
tr:hover td{background:#fafcfb}
td b{font-weight:700}
td .sub{display:block;font-size:11px;color:var(--muted);margin-top:2px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:#eef3ef;padding:2px 6px;border-radius:5px}

/* ---------- BADGES ---------- */
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.b-pending{background:#fff4dc;color:#9b6500}
.b-success,.b-live,.b-open-gw{background:#e5f8ef;color:#0e7a54}
.b-failed,.b-open{background:#fdeaea;color:#a53434}
.b-refunded,.b-reviewing{background:#e9eef7;color:#3c65a7}
.b-final{background:#e6f2e9;color:#1f6d4b}
.b-locked,.b-progress{background:#efe8fb;color:#5b3ca0}
.b-telebirr{background:#f3ecfc;color:#5a2d82}
.b-cbe{background:#fbeaea;color:#8b2e2e}
.b-internal{background:#eef3ef;color:var(--green2)}
.b-dismissed{background:#eef3ef;color:var(--muted)}
.b-confirmed{background:#fdeaea;color:#a53434}

/* ---------- BUTTONS ---------- */
.btn{
  border:0;border-radius:9px;padding:7px 13px;font-weight:700;font-size:11.5px;
  cursor:pointer;transition:transform .1s;
}
.btn:active{transform:scale(.97)}
.btn + .btn{margin-left:6px}
.btn-approve{background:var(--green);color:#fff}
.btn-reject{background:#fbeaea;color:var(--red)}
.btn-ghost{background:#eef3ef;color:var(--text)}
.btn-primary{background:var(--green);color:#fff}
.btn-sm{padding:5px 10px;font-size:11px}

/* ---------- EMPTY / TOAST ---------- */
.empty{padding:34px 24px;text-align:center;color:var(--muted);font-size:13px}
.empty .big{font-size:28px;margin-bottom:6px;opacity:.5}
.toast{
  position:fixed;bottom:24px;left:50%;transform:translate(-50%,15px);
  background:#17212b;color:#fff;padding:11px 18px;border-radius:11px;
  font-size:12.5px;opacity:0;transition:.2s;z-index:99;max-width:80%;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.43);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.show{display:flex}
.modal-card{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:460px;max-height:88vh;overflow:auto}
.modal-card h3{margin:0 0 6px;font-size:16px}
.modal-card p{font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.5}
.modal-card label{font-size:11px;font-weight:800;display:block;margin-bottom:6px}
.modal-card input,.modal-card select{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;
  outline:none;background:#f8faf9;margin-bottom:12px;
}
.modal-card input:focus,.modal-card select:focus{border-color:var(--green);background:#fff}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1;padding:11px}

/* ---------- RESPONSIVE ---------- */
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  aside{position:relative;height:auto;width:100%}
  aside nav{display:flex;overflow-x:auto;gap:4px}
  aside nav a{white-space:nowrap}
  .cards{grid-template-columns:repeat(2,1fr)}
  main{padding:18px}
}
</style>
</head>
<body>

<!-- ============================================================
     LOGIN VIEW
     ============================================================ -->
<div id="loginView" class="login-wrap">
  <form class="login" onsubmit="event.preventDefault(); doLogin();">
    <div class="login-logo">F</div>
    <h1>FPL Weekly Admin</h1>
    <p>Sign in with your admin account.</p>
    <div class="login-error" id="loginError"></div>
    <label>Email / phone</label>
    <div class="input-wrap"><input id="loginEmail" type="text" autocomplete="username" value="admin@example.com"></div>
    <label>Password</label>
    <div class="input-wrap">
      <input id="loginPassword" type="password" autocomplete="current-password">
      <button type="button" class="toggle-pw" onclick="togglePw()">👁</button>
    </div>
    <button class="login-btn" id="loginBtn" type="submit">Sign in</button>
    <p class="login-foot">FPL Weekly · admin panel</p>
  </form>
</div>

<!-- ============================================================
     APP VIEW
     ============================================================ -->
<div id="appView" class="layout" style="display:none">
  <aside>
    <div class="aside-brand">
      <div class="aside-logo">F</div>
      <div><h1>FPL Weekly</h1><small>Admin dashboard</small></div>
    </div>
    <div class="aside-user">
      <b id="asideUserName">—</b>
      <span id="asideUserEmail">—</span>
      <span class="role" id="asideUserRole">—</span>
    </div>
    <nav id="mainNav">
      <a data-view="overview" class="active"><span class="ico">◈</span> Overview</a>
      <a data-view="deposits" data-roles="finance_admin,super_admin"><span class="ico">⬇</span> Deposits <span class="count hidden" id="cntDeposits">0</span></a>
      <a data-view="withdrawals" data-roles="finance_admin,super_admin"><span class="ico">⬆</span> Withdrawals <span class="count hidden" id="cntWithdrawals">0</span></a>
      <a data-view="gameweeks"><span class="ico">▣</span> Gameweeks</a>
      <a data-view="users"><span class="ico">●</span> Users</a>
      <a data-view="fraud"><span class="ico">⚑</span> Fraud <span class="count hidden" id="cntFraud">0</span></a>
      <a data-view="audit"><span class="ico">✎</span> Audit log</a>
      <a data-view="settings" data-roles="super_admin"><span class="ico">⚙</span> Settings</a>
    </nav>
    <div class="aside-foot">
      <div>Full record editing (roles, raw tables) is still in the <a href="/admin" style="color:#7de0b8">sqladmin panel</a>.</div>
      <button class="aside-logout" onclick="doLogout()">Log out</button>
    </div>
  </aside>

  <main id="mainContent">
    <!-- views are rendered here by JS -->
  </main>
</div>

<div id="modal" class="modal">
  <div class="modal-card" id="modalCard"></div>
</div>
<div id="toast" class="toast"></div>

<script>
// ============================================================
// AUTH
// ============================================================
const API_BASE = "";
let authToken = sessionStorage.getItem("admin_token") || null;
let authRole = sessionStorage.getItem("admin_role") || null;
let authEmail = sessionStorage.getItem("admin_email") || null;

async function api(path, options = {}) {
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  if (authToken) headers.Authorization = `Bearer ${authToken}`;
  const resp = await fetch(`${API_BASE}${path}`, { ...options, headers });
  if (resp.status === 401) { doLogout(); throw new Error("Session expired — please sign in again."); }
  if (!resp.ok) {
    const body = await resp.json().catch(() => ({}));
    throw new Error(body.detail || `Request failed (${resp.status})`);
  }
  return resp.status === 204 ? null : resp.json();
}

function togglePw() {
  const el = document.getElementById("loginPassword");
  el.type = el.type === "password" ? "text" : "password";
}

async function doLogin() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const btn = document.getElementById("loginBtn");
  const err = document.getElementById("loginError");
  err.classList.remove("show");
  btn.disabled = true; btn.textContent = "Signing in…";
  try {
    const form = new URLSearchParams();
    form.set("username", email);
    form.set("password", password);
    const resp = await fetch("/auth/login", { method: "POST", body: form });
    if (!resp.ok) throw new Error("Invalid credentials");
    const data = await resp.json();
    authToken = data.access_token;
    const payload = JSON.parse(atob(authToken.split(".")[1]));
    authRole = payload.role;
    authEmail = email;
    sessionStorage.setItem("admin_token", authToken);
    sessionStorage.setItem("admin_role", authRole);
    sessionStorage.setItem("admin_email", authEmail);
    enterApp();
  } catch (e) {
    err.textContent = e.message || "Sign-in failed.";
    err.classList.add("show");
  } finally {
    btn.disabled = false; btn.textContent = "Sign in";
  }
}

function doLogout() {
  authToken = null; authRole = null; authEmail = null;
  sessionStorage.clear();
  document.getElementById("appView").style.display = "none";
  document.getElementById("loginView").style.display = "grid";
}

function enterApp() {
  document.getElementById("loginView").style.display = "none";
  document.getElementById("appView").style.display = "grid";
  document.getElementById("asideUserName").textContent = authEmail;
  document.getElementById("asideUserEmail").textContent = authEmail;
  document.getElementById("asideUserRole").textContent = authRole.replace(/_/g, " ");

  document.querySelectorAll("#mainNav a").forEach(a => {
    const roles = a.dataset.roles;
    if (roles && !roles.split(",").includes(authRole)) { a.style.display = "none"; }
    a.onclick = () => go(a.dataset.view);
  });
  go("overview");
}

// ============================================================
// NAVIGATION
// ============================================================
function go(view) {
  document.querySelectorAll("#mainNav a").forEach(a => a.classList.toggle("active", a.dataset.view === view));
  const renderers = { overview: renderOverview, deposits: renderDeposits, withdrawals: renderWithdrawals, gameweeks: renderGameweeks, users: renderUsers, fraud: renderFraud, audit: renderAudit, settings: renderSettings };
  (renderers[view] || renderOverview)();
}

function etb(n) { return Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 }) + " ETB"; }
function badgeClass(status) {
  const map = { pending: "b-pending", approved: "b-success", success: "b-success", rejected: "b-failed", failed: "b-failed", cancelled: "b-dismissed", processing: "b-progress", registration_open: "b-open-gw", registration_locked: "b-locked", archived: "b-final" };
  return map[status] || "b-internal";
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}
function closeModal() { document.getElementById("modal").classList.remove("show"); }

// ============================================================
// OVERVIEW
// ============================================================
async function renderOverview() {
  const main = document.getElementById("mainContent");
  main.innerHTML = `<div class="page-head"><div><h2>Overview</h2><p>Live status across the current gameweek and pending admin actions.</p></div></div><div class="cards" id="ovCards"><div class="empty">Loading…</div></div>`;
  try {
    const d = await api("/admin-api/overview");
    document.getElementById("ovCards").outerHTML = `
    <div class="cards">
      <div class="card accent"><div class="k">Current gameweek</div><div class="v">${d.current_gw_number ? "GW " + d.current_gw_number : "None open"}</div></div>
      <div class="card accent"><div class="k">Participants</div><div class="v">${d.participants}</div></div>
      <div class="card accent"><div class="k">Prize pool</div><div class="v">${etb(d.prize_pool)}</div></div>
      <div class="card"><div class="k">Registered users</div><div class="v">${d.total_users}</div></div>
    </div>
    <div class="cards">
      <div class="card"><div class="k">Pending deposits</div><div class="v">${d.pending_deposits}</div><div class="d">${etb(d.pending_deposit_amount)}</div></div>
      <div class="card"><div class="k">Pending withdrawals</div><div class="v">${d.pending_withdrawals}</div><div class="d">${etb(d.pending_withdrawal_amount)}</div></div>
      <div class="card"><div class="k">Completed payouts</div><div class="v">${etb(d.completed_payout_amount)}</div></div>
      <div class="card"><div class="k">Open fraud alerts</div><div class="v">${d.open_fraud_alerts}</div></div>
    </div>`;
    const cnt = id => document.getElementById(id);
    if (cnt("cntDeposits")) { cnt("cntDeposits").textContent = d.pending_deposits; cnt("cntDeposits").classList.toggle("hidden", d.pending_deposits === 0); }
    if (cnt("cntWithdrawals")) { cnt("cntWithdrawals").textContent = d.pending_withdrawals; cnt("cntWithdrawals").classList.toggle("hidden", d.pending_withdrawals === 0); }
    if (cnt("cntFraud")) { cnt("cntFraud").textContent = d.open_fraud_alerts; cnt("cntFraud").classList.toggle("hidden", d.open_fraud_alerts === 0); }
  } catch (e) { main.querySelector(".cards").innerHTML = `<div class="empty">${e.message}</div>`; }
}

// ============================================================
// DEPOSITS
// ============================================================
async function renderDeposits() {
  const main = document.getElementById("mainContent");
  main.innerHTML = `<div class="page-head"><div><h2>Deposits</h2><p>Verify Telebirr/CBE transaction IDs against your statement before approving.</p></div></div>
    <div class="panel"><div class="panel-head"><h3>All deposit requests</h3></div><div class="panel-body" id="depositsBody"><div class="empty">Loading…</div></div></div>`;
  try {
    const rows = await api("/deposits");
    const body = document.getElementById("depositsBody");
    body.innerHTML = rows.length ? `<table><thead><tr><th>Method</th><th>Amount</th><th>Transaction ID</th><th>Status</th><th>Submitted</th><th></th></tr></thead><tbody>
      ${rows.map(d => `<tr>
        <td><span class="badge b-${d.method}">${d.method}</span></td>
        <td><b>${etb(d.amount)}</b></td>
        <td><code>${d.transaction_id}</code></td>
        <td><span class="badge ${badgeClass(d.status)}">${d.status}</span></td>
        <td class="sub">${new Date(d.created_at).toLocaleString()}</td>
        <td>${d.status === "pending" ? `<button class="btn btn-approve btn-sm" onclick="approveDeposit('${d.id}')">Approve</button><button class="btn btn-reject btn-sm" onclick="rejectDeposit('${d.id}')">Reject</button>` : ""}</td>
      </tr>`).join("")}
    </tbody></table>` : `<div class="empty"><div class="big">✓</div>No deposit requests yet.</div>`;
  } catch (e) {
    document.getElementById("depositsBody").innerHTML = `<div class="empty">${e.message}</div>`;
  }
}
async function approveDeposit(id) {
  try { await api(`/deposits/${id}/approve`, { method: "POST" }); toast("Deposit approved and wallet credited"); renderDeposits(); }
  catch (e) { toast(e.message); }
}
async function rejectDeposit(id) {
  const reason = prompt("Reason for rejecting this deposit?");
  if (reason === null) return;
  try { await api(`/deposits/${id}/reject?reason=${encodeURIComponent(reason)}`, { method: "POST" }); toast("Deposit rejected"); renderDeposits(); }
  catch (e) { toast(e.message); }
}

async function approveWithdrawal(id) {

async function rejectWithdrawal(id) {
  const reason = prompt("Reason for rejecting this withdrawal?");

// GAMEWEEKS
// ============================================================
async function renderGameweeks() {
  const main = document.getElementById("mainContent");
  main.innerHTML = `<div class="page-head"><div><h2>Gameweeks</h2><p>Open a new gameweek for registration.</p></div><button class="btn btn-primary" onclick="openCreateGameweek()">+ New gameweek</button></div>
    <div class="panel"><div class="panel-head"><h3>All gameweeks</h3></div><div class="panel-body" id="gwBody"><div class="empty">Loading…</div></div></div>`;
  try {
    const rows = await api("/admin-api/gameweeks");
    const body = document.getElementById("gwBody");
    body.innerHTML = rows.length ? `<table><thead><tr><th>GW</th><th>Entry fee</th><th>Participants</th><th>Prize pool</th><th>Deadline</th><th>Status</th></tr></thead><tbody>
      ${rows.map(g => `<tr>
        <td><b>GW${g.gw_number}</b></td>
        <td>${etb(g.entry_fee)}</td>
        <td>${g.participants}</td>
        <td>${etb(g.prize_pool)}</td>
        <td class="sub">${new Date(g.registration_deadline).toLocaleString()}</td>
        <td><span class="badge ${badgeClass(g.status)}">${g.status.replace(/_/g, " ")}</span></td>
      </tr>`).join("")}
    </tbody></table>` : `<div class="empty"><div class="big">▣</div>No gameweeks yet — create one to get started.</div>`;
  } catch (e) {
    document.getElementById("gwBody").innerHTML = `<div class="empty">${e.message}</div>`;
  }
}
function openCreateGameweek() {
  document.getElementById("modalCard").innerHTML = `
    <h3>New gameweek</h3>
    <p>Opens immediately for registration.</p>
    <label>Gameweek number</label>
    <input id="gwNumber" type="number" min="1">
    <label>Entry fee (ETB)</label>
    <input id="gwEntryFee" type="number" value="200">
    <label>Registration deadline</label>
    <input id="gwDeadline" type="datetime-local">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitCreateGameweek()">Create</button>
    </div>`;
  document.getElementById("modal").classList.add("show");
}
async function submitCreateGameweek() {
  const gw_number = parseInt(document.getElementById("gwNumber").value, 10);
  const entry_fee = parseFloat(document.getElementById("gwEntryFee").value);
  const deadline = document.getElementById("gwDeadline").value;
  if (!gw_number || !deadline) { toast("Fill in all fields"); return; }
  try {
    await api("/admin-api/gameweeks", { method: "POST", body: JSON.stringify({ gw_number, entry_fee, registration_deadline: new Date(deadline).toISOString() }) });
    toast(`Gameweek ${gw_number} created`);
    closeModal();
    renderGameweeks();
  } catch (e) { toast(e.message); }
}

// SETTINGS (super admin only)
// ============================================================
async function renderSettings() {
  const main = document.getElementById("mainContent");
  main.innerHTML = `<div class="page-head"><div><h2>Settings</h2><p>Platform-wide toggles. Changes apply immediately across the Mini App.</p></div></div>
    <div class="panel"><div class="panel-head"><h3>Advertising</h3></div><div class="panel-body" id="settingsBody"><div class="empty">Loading…</div></div></div>`;
  try {
    const s = await api("/admin-api/settings");
    const body = document.getElementById("settingsBody");
    body.innerHTML = `
      <div class="setting-row">
        <div class="setting-label">
          <b>Show ads in the Mini App</b>
          <span>When off, the ad banner slots are removed entirely — not just hidden.</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="adsEnabledToggle" ${s.ads_enabled ? "checked" : ""}>
          <span class="slider"></span>
        </label>
      </div>`;
    document.getElementById("adsEnabledToggle").onchange = async (e) => {
      const next = e.target.checked;
      e.target.disabled = true;
      try {
        await api("/admin-api/settings", { method: "PATCH", body: JSON.stringify({ ads_enabled: next }) });
        toast(next ? "Ads turned on" : "Ads turned off");
      } catch (err) {
        e.target.checked = !next;
        toast(err.message);
      } finally {
        e.target.disabled = false;
      }
    };
  } catch (e) {
    document.getElementById("settingsBody").innerHTML = `<div class="empty">${e.message}</div>`;
  }
}
